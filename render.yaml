# Render blueprint — one web service serving both the API and the built SPA.
#
# Single origin is deliberate (docs/decisions.md, Decision 4): the session
# cookie stays SameSite=Lax and there is no CORS configuration to get wrong.
# Splitting the SPA onto a second host would force SameSite=None; Secure and a
# cross-site cookie, which is more to configure and more to break.
#
# The database is Neon, created separately — it is not managed by this file, so
# that the free Postgres 30-day expiry on Render cannot take the live URL down.

services:
  - type: web
    name: lending-library
    runtime: node
    plan: free
    region: singapore

    # `--include=dev` matters: Render sets NODE_ENV=production, which makes
    # `npm ci` skip devDependencies — and tsc, vite and the Prisma CLI all live
    # there. Without it the build has nothing to build with.
    #
    # Migrations run here rather than as a pre-deploy step, which Render offers
    # only on paid plans. `migrate deploy` applies pending migrations and
    # nothing else, so re-running it on every deploy is a no-op; a failure fails
    # the build loudly instead of starting a server against the wrong schema.
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate:deploy

    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"

      # Runtime connection. Neon's POOLED endpoint, as the least-privilege
      # `lending_app` role. Prisma needs ?pgbouncer=true&connection_limit=1 on
      # a pooled endpoint.
      - key: DATABASE_URL
        sync: false

      # Migrations and seeding. Neon's DIRECT (unpooled) endpoint as the owner
      # role — pgbouncer cannot run the DDL that migrations issue.
      - key: ADMIN_DATABASE_URL
        sync: false

      # Signs nothing by itself: it is the HMAC key the session token hashes
      # are derived from. Generated once by Render and never committed.
      - key: SESSION_SECRET
        generateValue: true
